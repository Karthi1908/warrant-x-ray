services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: warrant-xray:latest
    ports:
      - "8000:8000"
    environment:
      - WX_DB_URL=sqlite+aiosqlite:///data/warrantx.db
      - WX_LOG_LEVEL=INFO
      - WX_SOURCE_ENABLED=true
      - WX_RISK_FREE_RATE=0.03
    env_file:
      - .env
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped

volumes:
  sqlite_data:
    driver: local
