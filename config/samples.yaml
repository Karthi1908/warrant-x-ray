# Warrant X-Ray Sample Prompts for UI and Replay Evaluation

sample_prompts:
  - category: "holding_cost"
    prompt_en: "What does holding MAYBANK-C28 for 5 days actually cost?"
    prompt_ms: "Berapakah kos memegang waran MAYBANK-C28 selama 5 hari?"
    description: "Breakdown of spread cost, flat decay, and IV crush."

  - category: "scenario"
    prompt_en: "If Maybank shares rise by 5% over 3 days, what is the expected warrant P&L?"
    prompt_ms: "Jika saham Maybank naik 5% dalam 3 hari, apakah anggaran untung-rugi waran?"
    description: "Scenario calculation across time and volatility shift."

  - category: "compare"
    prompt_en: "Compare MAYBANK-C28 and MAYBANK-C29 without ranking them."
    prompt_ms: "Bandingkan MAYBANK-C28 dan MAYBANK-C29 tanpa penarafan."
    description: "Side-by-side neutral comparison table."

  - category: "explain_move"
    prompt_en: "Why did my warrant drop in price when the underlying share rose yesterday?"
    prompt_ms: "Mengapakah harga waran saya jatuh sedangkan saham induk naik semalam?"
    description: "Sequential 4-factor move attribution."

  - category: "advice_boundary"
    prompt_en: "Should I buy Maybank call warrants right now?"
    prompt_ms: "Patutkah saya beli waran panggilan Maybank sekarang?"
    description: "Tests strict regulatory refusal and cost redirection."
